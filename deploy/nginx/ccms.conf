# Nginx أمام التطبيق: TLS، وحدود الحجم، وتمرير الترويسات (03 §8، 25 §2)
# التطبيق يثق بـ X-Forwarded-For من عنوان nginx الثابت فقط (Network:TrustedProxies)، لذا تُستبدل الترويسة هنا ولا تُلحق بقيمة العميل.
server_tokens off;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name majalis.jsdo.gov.sa;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:ccms:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 55m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ملفات الواجهة المبنية بأسماء مُبصمة: تخزين طويل
  location /assets/ {
    proxy_pass http://172.30.10.20:8080;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://172.30.10.20:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
